# بناء الملف التنفيذي والمثبّت، وتوقيعهما، والتحقق من مصدرهما
#
# التشغيل:
#   - عند دفع وسم بصيغة v* (مثل v1.0.2) يبني الملف والمثبّت وينشئ الإصدار تلقائياً.
#   - أو يدوياً من صفحة Actions (workflow_dispatch) للتجربة بدون نشر.
#
# ما يفعله هذا الملف:
#   1) يبني pdf2md.exe على windows-latest من نفس ملفات المستودع.
#   2) يوقّع الملف عبر SignPath (إن كانت أسرار التوقيع موجودة) ثم يبني المثبّت
#      من الملف الموقّع، ثم يوقّع المثبّت أيضاً — فالمثبّت يحمل برنامجاً موقّعاً.
#   3) يحسب بصمة SHA256 لكلا الملفين ويحفظها في SHA256SUMS.txt.
#   4) ينشئ "إثبات مصدر البناء" (build provenance attestation) عبر Sigstore.
#      هذا يربط الملفات بالـ commit الذي بُنيت منه، ويتيح لأي شخص التحقق منها.
#   5) عند الدفع بوسم، ينشر الملف والمثبّت والبصمة كإصدار جديد.
#
# لا يوجد سر (secret) داخل المستودع، ولا يحتاج هذا الملف أي مفتاح من المستخدم.
# التوقيع اختياري: إن لم تُضبط أسرار SignPath، يُنشر كل شيء بدون توقيع (كحال v1.0.0 و v1.0.1).

name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write
  actions: read  # SignPath يقرأ ملفات البناء من هذا التشغيل

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path 'app\__init__.py' -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "app version: $v"

      - name: Build the executable
        run: python -m PyInstaller pdf2md.spec --noconfirm --clean

      # ------------------------------------------------------------ التوقيع
      - name: Check code signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += 'secret SIGNPATH_API_TOKEN' }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }
          if ($missing.Count -eq 0) {
            'enabled=true' >> $env:GITHUB_OUTPUT
            Write-Host 'SignPath مفعّل — سيُوقَّع الملف والمثبّت.'
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Host ("التوقيع غير مفعّل (ناقص: " + ($missing -join '، ') + ") — سيُنشر كل شيء بدون توقيع.")
          }

      - name: Upload unsigned executable for signing
        id: upload-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-pdf2md
          path: dist/pdf2md.exe
          archive: false
          retention-days: 1
          overwrite: true

      - name: Sign the executable (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Use the signed executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = 'signed-app\pdf2md.exe'
          if (-not (Test-Path $signed)) { throw "الملف الموقّع غير موجود: $signed" }
          Copy-Item $signed 'dist\pdf2md.exe' -Force
          Write-Host 'استُبدل الملف التنفيذي بالنسخة الموقّعة.'

      # ------------------------------------------------------------ المثبّت
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress --limit-output

      - name: Build the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup غير موجود على المشغّل' }
          # البناء في مجلّد مؤقّت: أحياناً يقفل مكافح الفيروسات الملف الناتج في dist (رمز 110)
          $out = Join-Path $env:TEMP 'pdf2md-installer-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $exe = (Resolve-Path 'dist\pdf2md.exe').Path
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            & $iscc "/DPdf2mdExe=$exe" "/DOutputDir=$out" "/DAppVersion=$env:APP_VERSION" 'installer\pdf2md.iss'
            $ok = ($LASTEXITCODE -eq 0) -and (Test-Path (Join-Path $out 'pdf2md-Setup.exe'))
            if (-not $ok) { Write-Host "محاولة بناء المثبّت فشلت ($i/3) — إعادة المحاولة" ; Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw 'فشل بناء المثبّت بعد 3 محاولات' }
          Copy-Item (Join-Path $out 'pdf2md-Setup.exe') 'dist\pdf2md-Setup.exe' -Force
          Get-Item 'dist\pdf2md-Setup.exe' | Select-Object Name, Length

      - name: Upload unsigned installer for signing
        id: upload-setup
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-pdf2md-setup
          path: dist/pdf2md-Setup.exe
          archive: false
          retention-days: 1
          overwrite: true

      - name: Sign the installer (SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Use the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = 'signed-setup\pdf2md-Setup.exe'
          if (-not (Test-Path $signed)) { throw "المثبّت الموقّع غير موجود: $signed" }
          Copy-Item $signed 'dist\pdf2md-Setup.exe' -Force
          Write-Host 'استُبدل المثبّت بالنسخة الموقّعة.'

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('dist\pdf2md.exe', 'dist\pdf2md-Setup.exe')) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            Write-Host ("{0}: {1} ({2})" -f $f, $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne 'Valid') { throw "توقيع غير صالح: $f" }
          }

      # ------------------------------------------------------------ البصمات والإثبات
      - name: Compute SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @()
          foreach ($f in @('dist\pdf2md.exe', 'dist\pdf2md-Setup.exe')) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            $lines += "$hash  $(Split-Path $f -Leaf)"
            Write-Output "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath 'SHA256SUMS.txt' -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/pdf2md.exe
            dist/pdf2md-Setup.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2md-windows
          path: |
            dist/pdf2md.exe
            dist/pdf2md-Setup.exe
            SHA256SUMS.txt
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.enabled == 'true' }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $body = @"
          ### pdf2md $tag

          - **مثبّت** (`pdf2md-Setup.exe`): تثبيت لكل مستخدم بلا صلاحيات إدارية، ومدخل في لوحة التحكم ← البرامج مع مزيل، واختصارات في قائمة ابدأ.
          - **ملف محمول** (`pdf2md.exe`): بلا تثبيت، شغّله مباشرة.

          بصمة SHA256 لكلا الملفين في `SHA256SUMS.txt` المرفق.
          "@          if ($env:SIGNED -eq 'true') {
            $body += "`nFree code signing provided by SignPath.io, certificate by SignPath Foundation."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "pdf2md $tag" --notes $body
          } else {
            gh release edit $tag --notes $body
          }
          gh release upload $tag 'dist\pdf2md.exe' 'dist\pdf2md-Setup.exe' 'SHA256SUMS.txt' --clobber

  # ------------------------------------------------------------ ماك
  # يبني نسخة .app على macos runners ( arm64 و x64 )، ويوقّعها توقيعاً ذاتياً (بلا حساب Apple)،
  # ثم ينشر DMG و zip على الإصدار نفسه. يعمل بعد بناء ويندوز حتى يكون الإصدار موجوداً.
  build-macos:
    name: Build on macOS (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple Silicon (macOS 15)
            arch: arm64
          - os: macos-15-intel    # Intel (macOS 15)
            arch: x64

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Build the app bundle
        run: python -m PyInstaller pdf2md.spec --noconfirm --clean

      - name: Sign and package (DMG + zip)
        run: bash installer/make_dmg.sh ${{ matrix.arch }}

      - name: Compute SHA256
        run: |
          shasum -a 256 "dist/pdf2md-macos-${{ matrix.arch }}.dmg" "dist/pdf2md-macos-${{ matrix.arch }}.zip" \
            > "dist/SHA256SUMS-macos-${{ matrix.arch }}.txt"
          cat "dist/SHA256SUMS-macos-${{ matrix.arch }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2md-macos-${{ matrix.arch }}
          path: |
            dist/pdf2md-macos-${{ matrix.arch }}.dmg
            dist/pdf2md-macos-${{ matrix.arch }}.zip
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          retention-days: 30

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/pdf2md-macos-${{ matrix.arch }}.dmg" \
            "dist/pdf2md-macos-${{ matrix.arch }}.zip" \
            "dist/SHA256SUMS-macos-${{ matrix.arch }}.txt" --clobber

      # وصف نسخة ماك في صفحة الإصدار — مرة واحدة (arm64) حتى لا يتسابق العمودان.
      - name: Describe the macOS build in the release notes
        if: startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'arm64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note=$(cat <<'EOF'

          ### نسخة ماك

          - **`pdf2md-macos-arm64.dmg`** لأجهزة Apple Silicon، و**`pdf2md-macos-x64.dmg`** لأجهزة Intel.
          - اسحب التطبيق إلى مجلّد Applications. النسخة **بدون توقيع Apple Developer**، فmacOS يحجبها عند أول فتح:
            اضغط بالزر الأيمن على التطبيق ثم **فتح**، أو من الطرفية:
            `xattr -dr com.apple.quarantine /Applications/pdf2md.app`
          - بصمة SHA256 في `SHA256SUMS-macos-arm64.txt` و `SHA256SUMS-macos-x64.txt`.
          - الوضع السحابي فقط في نسخة ماك (Gemini / OpenAI / OCR.space)؛ المحرّكات المحلية متاحة على ويندوز.
          EOF
          )
          body="$(gh release view "${{ github.ref_name }}" --json body --jq .body)"
          printf '%s\n%s\n' "$body" "$note" > /tmp/notes.md
          gh release edit "${{ github.ref_name }}" --notes-file /tmp/notes.md
